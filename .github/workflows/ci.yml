name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: forensics_test
          POSTGRES_USER: forensics
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forensics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://forensics:testpass@localhost:5432/forensics_test
      DATABASE_URL_SYNC: postgresql://forensics:testpass@localhost:5432/forensics_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose DB connectivity
        run: |
          echo "DATABASE_URL_SYNC=$DATABASE_URL_SYNC"
          python -c "import os, sys, psycopg2; print('Testing DB: ' + os.environ.get('DATABASE_URL_SYNC', 'NOT SET'), flush=True); conn = psycopg2.connect(os.environ['DATABASE_URL_SYNC'], connect_timeout=10); print('DB OK, version: ' + str(conn.server_version), flush=True); cur = conn.cursor(); cur.execute('SELECT 1'); print('Query OK: ' + str(cur.fetchone()), flush=True); conn.close(); print('DB DIAGNOSIS COMPLETE', flush=True)"
      - name: Run alembic with verbose output
        run: |
          echo "=== ALEMBIC INFO ==="
          alembic info
          echo ""
          echo "=== ALEMBIC CURRENT ==="
          alembic current
          echo ""
          echo "=== RUNNING ALEMBIC UPGRADE ==="
          alembic upgrade head -v
          echo ""
          echo "=== ALEMBIC EXIT ==="
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
