name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: forensics_test
          POSTGRES_USER: forensics
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forensics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://forensics:testpass@localhost:5432/forensics_test
      DATABASE_URL_SYNC: postgresql://forensics:testpass@localhost:5432/forensics_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose DB connectivity
        run: |
          python -c "
          import os, sys, psycopg2
          print('Testing DB connection to: ' + os.environ['DATABASE_URL_SYNC'])
          try:
              conn = psycopg2.connect(os.environ['DATABASE_URL_SYNC'], connect_timeout=10)
              print('DB connection OK, server version: ' + str(conn.server_version))
              cur = conn.cursor()
              cur.execute('SELECT 1')
              print('Query OK: ' + str(cur.fetchone()))
              conn.close()
          except Exception as e:
              print('DB connection FAILED: ' + str(e), file=sys.stderr)
              import traceback; traceback.print_exc()
              sys.exit(1)
          "
      - name: Run alembic migrations
        run: |
          set -o pipefail
          alembic upgrade head > alembic_output_stdout.txt 2> alembic_output_stderr.txt
          ALEMBIC_STATUS=$?
          echo "alembic_exit_status=$ALEMBIC_STATUS" > alembic_result.txt
          if [ $ALEMBIC_STATUS -ne 0 ]; then
            echo "ALEMBIC_FAILED=true" >> alembic_result.txt
            echo "=== ALEMBIC STDERR ===" >> alembic_result.txt
            cat alembic_output_stderr.txt >> alembic_result.txt
            echo "" >> alembic_result.txt
            echo "=== ALEMBIC STDOUT ===" >> alembic_result.txt
            cat alembic_output_stdout.txt >> alembic_result.txt
          fi
          cat alembic_result.txt
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
